<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 — 7월 27일</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --text: #e8eaf0;
    --muted: #9aa1b0;
    --accent: #5b8cff;
    --border: #262b36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 20px;
  }
  h1 { font-size: 28px; margin-bottom: 12px; }
  p { color: var(--muted); line-height: 1.7; }
  .status {
    margin-top: 28px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3ecf8e;
    margin-right: 6px;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">2026.07.27 시작</span>
    <h1>새 포트폴리오 프로젝트</h1>
    <p>이 페이지는 초기 배포 확인용입니다.<br>여기에 프로젝트 기능들이 하나씩 추가됩니다.</p>
    <div class="status"><span class="dot"></span>Cloudflare Pages 배포 정상</div>
  </main>
</body>
</html>
